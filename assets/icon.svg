<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4D6BFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2546E0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- DeepSeek 风格鲸鱼主体 -->
  <g transform="translate(256,240)">
    <!-- 鲸鱼身体 - 流线型 -->
    <path d="
      M-120,20
      C-120,-60 -80,-120 0,-120
      C60,-120 100,-80 120,-20
      C140,30 120,80 80,100
      C40,120 0,110 -40,90
      C-80,70 -100,50 -120,20
      Z
    " fill="url(#whale)" opacity="0.95"/>

    <!-- 鲸鱼尾巴 -->
    <path d="
      M-40,90
      C-60,120 -90,140 -110,120
      C-100,100 -70,90 -40,90
      Z
    " fill="white" opacity="0.8"/>

    <!-- 鲸鱼眼睛 -->
    <circle cx="50" cy="-40" r="18" fill="url(#bg)"/>
    <circle cx="54" cy="-44" r="7" fill="white"/>

    <!-- 喷水孔/信号波 -->
    <g opacity="0.7">
      <path d="M-20,-120 C-10,-150 10,-150 20,-120" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-30,-140 C-15,-175 15,-175 30,-140" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- AI 网格线条 -->
    <g stroke="white" stroke-width="1.5" opacity="0.3">
      <line x1="-60" y1="-20" x2="80" y2="-20"/>
      <line x1="-40" y1="20" x2="100" y2="20"/>
      <line x1="-20" y1="60" x2="60" y2="60"/>
      <line x1="0" y1="-100" x2="0" y2="80"/>
      <line x1="40" y1="-100" x2="40" y2="100"/>
    </g>
  </g>

  <!-- DSH 文字 -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8">DSH</text>

  <!-- 底部小字 -->
  <text x="256" y="455" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.6" letter-spacing="4">HARNESS</text>
</svg>
